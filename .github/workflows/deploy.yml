name: Deploy to GitHub Pages
# 同一份工作流两边通用：正式站仓库 kyle-ao-code.github.io 用 BASE=/；
# 其他仓库（预览站 library-preview）用 BASE=/<仓库名>，并打开 PREVIEW=1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          SITE: https://kyle-ao-code.github.io
          BASE: ${{ github.event.repository.name == 'kyle-ao-code.github.io' && '/' || format('/{0}', github.event.repository.name) }}
          PREVIEW: ${{ github.event.repository.name == 'kyle-ao-code.github.io' && '0' || '1' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
